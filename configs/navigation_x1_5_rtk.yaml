# X1 手册 UG014 V1.1 表3-2：X1-5 / RTK / GNSS中断0秒。
# 水平RMS按二维合量解释，假定X/Y等方差；姿态以小角度FRD旋转向量近似。
# 新默认使用imu_gnss；以下独立PVA配置仅兼容历史统计模式，不参与新模型输出。
# 合成标准差保持手册指标：sigma_total^2 = sigma_slow^2 + sigma_white^2。
extends: hex_x_12kg.yaml
disturbances:
  imu_gnss:
    enabled: true
    accelerometer_bias_std_mps2: [0.000686, 0.000686, 0.000686]
    accelerometer_vrw_mps_sqrt_hour: [0.03, 0.03, 0.03]
    gyro_bias_std_degph: [3.0, 3.0, 3.0]
    gyro_arw_deg_sqrt_hour: [0.2, 0.2, 0.2]
    bias_correlation_time_s: 100.0
    gnss_enabled: true
    gnss_rate_hz: 5.0
    gnss_position_std_ned_m: [0.007778, 0.007778, 0.016]
    gnss_velocity_std_ned_mps: [0.021213, 0.021213, 0.03]
    heading_enabled: true
    heading_std_deg: 0.08
  navigation_position_error:
    enabled: true
    bias_std_sar_m: [0.009487, 0.009487, 0.017889]
    noise_std_sar_m: [0.004743, 0.004743, 0.008944]
    correlation_time_s: 8.0
  navigation_velocity_error:
    enabled: true
    bias_std_sar_mps: [0.012017, 0.012017, 0.012522]
    noise_std_sar_mps: [0.006008, 0.006008, 0.006261]
    correlation_time_s: 3.0
  navigation_attitude_error:
    enabled: true
    bias_std_body_deg: [0.016100, 0.016100, 0.075132]
    noise_std_body_deg: [0.008050, 0.008050, 0.037566]
    correlation_time_s: 5.0
