extends: navigation_x1_5_rtk.yaml
# 默认small等级；幅度为工程候选值，未经实测标定。
disturbances:
  translation:
    x: {enabled: true, unit: m, level: small, amplitude: 0.05}
    y: {enabled: true, unit: m, level: small, amplitude: 0.05}
    z: {enabled: true, unit: m, level: small, amplitude: 0.05}
  attitude:
    roll: {enabled: true, level: small, amplitude: 0.5}
    pitch: {enabled: true, level: small, amplitude: 0.5}
    yaw: {enabled: true, level: small, amplitude: 1.0}
  navigation_position_error:
    enabled: true
  navigation_velocity_error:
    enabled: true
  navigation_attitude_error:
    enabled: true
