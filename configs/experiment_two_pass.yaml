extends: navigation_x1_5_rtk.yaml
# A 三轴统一位置目标扰动，中等等级各轴 0.15 m OU 标准差；未经实测标定。
disturbances:
  translation:
    x: {enabled: true, unit: m}
    y: {enabled: true, unit: m}
    z: {enabled: true, unit: m}
  attitude:
    roll: {enabled: true}
    pitch: {enabled: true}
    yaw: {enabled: true}
  navigation_position_error:
    enabled: true
  navigation_velocity_error:
    enabled: true
  navigation_attitude_error:
    enabled: true
