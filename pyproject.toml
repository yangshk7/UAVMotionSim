[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airborne-sar-uav-motion-sim-open-source"
version = "1.1.0"
description = "Modular Hex-X SAR motion simulation with unified physical engines and acceptance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "PyYAML>=6",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "pandas>=2.1",
    "threadpoolctl>=3.2",
    "rotorpy==3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
uavsim = "uavsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: full scientific validation"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
